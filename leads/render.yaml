# Blueprint da Render: cria o site e o banco com um clique (veja o README).
services:
  - type: web
    name: chamador-de-leads
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Sao_Paulo
      - key: TRUST_PROXY
        value: "true"
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chamador-db
          property: connectionString

databases:
  - name: chamador-db
    plan: basic-256mb
    region: ohio
