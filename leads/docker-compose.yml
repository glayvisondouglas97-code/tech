# Sobe tudo com um comando:  docker compose up --build   →  http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chamador
      POSTGRES_PASSWORD: chamador
      POSTGRES_DB: chamador
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamador"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chamador:chamador@db:5432/chamador
      APP_URL: ${APP_URL:-http://localhost:3000}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    ports:
      - "3000:3000"

volumes:
  dbdata:
